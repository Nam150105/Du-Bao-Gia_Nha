<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự báo giá nhà · Hà Nội</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DG</span>
        <div>
          <h1>Dự báo giá nhà thông minh</h1>
          <p class="brand-meta">Hà Nội{% if model_ready %} · R² {{ "%.1f"|format(metrics.r2 * 100) }}%{% endif %}</p>
        </div>
      </div>
      {% if model_ready %}
      <div class="header-badge"><span class="dot-live"></span>Sẵn sàng</div>
      {% else %}
      <div class="header-badge warn">Chưa sẵn sàng</div>
      {% endif %}
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <section class="panel form-panel">
          <form id="predict-form" class="predict-form">
            <div class="field">
              <label for="property_type">Loại nhà</label>
              <select id="property_type" name="property_type" required>
                {% for code, label in property_types.items() %}
                <option value="{{ code }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="field region-field">
              <label for="city-input">Khu vực</label>
              <div class="combobox" id="city-combobox">
                <input type="text" id="city-input" class="combobox-input" autocomplete="off"
                  placeholder="Gõ tên tỉnh, thành…" aria-autocomplete="list"
                  aria-controls="city-panel" aria-expanded="false" role="combobox">
                <input type="hidden" id="city" name="city" value="" required>
                <div class="combobox-panel" id="city-panel" role="listbox" hidden>
                  <div class="combobox-list" id="city-list"></div>
                </div>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="area_m2">Diện tích (m²)</label>
                <input type="number" id="area_m2" name="area_m2" min="15" step="0.1" placeholder="75" required>
              </div>
              <div class="field" id="frontage-field" hidden>
                <label for="frontage_m">Mặt tiền (m)</label>
                <input type="number" id="frontage_m" name="frontage_m" min="0" step="0.1" placeholder="5">
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="bedrooms">Phòng ngủ</label>
                <input type="number" id="bedrooms" name="bedrooms" min="0" max="6" value="2" required>
              </div>
              <div class="field">
                <label for="bathrooms">Phòng tắm</label>
                <input type="number" id="bathrooms" name="bathrooms" min="1" max="4" value="2" required>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="legal_status">Pháp lý</label>
                <select id="legal_status" name="legal_status" required>
                  {% for code, label in legal_options.items() %}
                  <option value="{{ code }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="field">
                <label for="furnished_status">Nội thất</label>
                <select id="furnished_status" name="furnished_status" required>
                  {% for code, label in furnished_options.items() %}
                  <option value="{{ code }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">Dự báo giá</button>
          </form>
        </section>

        <section class="panel result-panel" id="result-panel">
          <div id="result-placeholder" class="result-idle">
            <p class="result-label">Giá dự báo</p>
            <p class="result-price muted">—</p>
          </div>
          <div id="result-body" hidden>
            <p class="result-label">Giá dự báo</p>
            <p class="result-price" id="result-price">—</p>
            <p class="result-full" id="result-full"></p>
            <div class="result-chips">
              <span class="chip" id="result-unit">—</span>
              <span class="chip" id="result-type">—</span>
              <span class="chip" id="result-area">—</span>
              <span class="chip" id="result-rooms">—</span>
            </div>
          </div>
        </section>

        <section class="news-rail">
          <div class="news-head">
            <span class="news-label" id="reference-title">Tin thị trường</span>
            <span class="news-count" id="reference-count-label"></span>
          </div>
          <div class="news-ticker">
            <div class="news-track" id="news-track"></div>
          </div>
        </section>
      </aside>

      <section class="map-hero">
        <div id="property-map" role="application" aria-label="Bản đồ nhà ở Hà Nội"></div>

        <div class="map-float map-float-tl">
          <div class="map-pill">
            <span class="map-pill-label">Hiển thị</span>
            <strong id="map-shown-count">—</strong>
          </div>
          <div class="map-pill">
            <span class="map-pill-label">Tổng</span>
            <strong id="map-total-count">—</strong>
          </div>
        </div>

        <div class="map-float map-float-tr">
          <label class="map-filter" for="map-property-type">
            <span>Loại nhà</span>
            <select id="map-property-type">
              <option value="">Tất cả</option>
              {% for code, label in property_types.items() %}
              <option value="{{ code }}">{{ label }}</option>
              {% endfor %}
            </select>
          </label>
        </div>

        <div class="map-float map-float-bl">
          <div class="map-legend">
            <span><i class="dot dot-blue"></i> Dữ liệu</span>
            <span><i class="dot dot-gold"></i> Khớp dự báo</span>
          </div>
        </div>

        <div class="map-loading" id="map-loading" hidden>
          <div class="map-spinner"></div>
          <p id="map-loading-text"></p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <script type="application/json" id="region-groups-data">{{ region_groups | tojson }}</script>
  <script type="application/json" id="frontage-types-data">{{ frontage_types | tojson }}</script>
  <script type="application/json" id="initial-references-data">{{ initial_references | tojson }}</script>
  <script type="application/json" id="default-city-data">{{ default_city | tojson }}</script>
  <script>
    const MAP_CITY = JSON.parse(document.getElementById("default-city-data").textContent);
    const form = document.getElementById("predict-form");
    const toast = document.getElementById("toast");
    const regionGroups = JSON.parse(document.getElementById("region-groups-data").textContent);
    const frontageTypes = JSON.parse(document.getElementById("frontage-types-data").textContent);
    const initialReferences = JSON.parse(document.getElementById("initial-references-data").textContent);
    const propertyTypeSelect = document.getElementById("property_type");
    const mapPropertyTypeSelect = document.getElementById("map-property-type");
    const frontageField = document.getElementById("frontage-field");
    const resultPlaceholder = document.getElementById("result-placeholder");
    const resultBody = document.getElementById("result-body");
    const newsTrack = document.getElementById("news-track");
    const refCountLabel = document.getElementById("reference-count-label");
    const refTitle = document.getElementById("reference-title");
    const mapShownCount = document.getElementById("map-shown-count");
    const mapTotalCount = document.getElementById("map-total-count");
    const mapLoading = document.getElementById("map-loading");
    const mapLoadingText = document.getElementById("map-loading-text");

    let isSubmitting = false;
    let hasPredicted = false;
    let pendingHighlightUrls = [];
    let propertyMap = null;
    let mapCluster = null;
    let mapLoadToken = 0;
    let mapInitialized = false;
    let mapCacheKey = "";

    const cityInput = document.getElementById("city-input");
    const cityHidden = document.getElementById("city");
    const cityPanel = document.getElementById("city-panel");
    const cityList = document.getElementById("city-list");
    const cityCombobox = document.getElementById("city-combobox");
    const allRegions = regionGroups.flatMap((g) => g.options.map((o) => ({ ...o, group: g.label })));

    function stripAccents(text) {
      return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function regionLabel(code) {
      const hit = allRegions.find((r) => r.code === code);
      return hit ? hit.name : code;
    }

    function setRegion(code, label) {
      cityHidden.value = code;
      cityInput.value = label || regionLabel(code);
      mapCacheKey = "";
      loadMapForSelection([], false);
    }

    function renderRegionList(query = "") {
      const q = stripAccents(query.trim());
      cityList.innerHTML = "";
      if (!q) {
        closeRegionPanel();
        return;
      }

      let count = 0;
      const maxItems = 8;
      for (const group of regionGroups) {
        if (count >= maxItems) break;
        for (const opt of group.options) {
          if (count >= maxItems) break;
          const hay = stripAccents(`${opt.name} ${opt.code}`);
          if (!hay.includes(q)) continue;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "combobox-option";
          btn.role = "option";
          btn.dataset.code = opt.code;
          btn.textContent = opt.name;
          if (opt.code === cityHidden.value) btn.classList.add("is-active");
          btn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            setRegion(opt.code, opt.name);
            closeRegionPanel();
          });
          cityList.appendChild(btn);
          count += 1;
        }
      }

      if (!count) {
        cityPanel.hidden = true;
        return;
      }
      openRegionPanelFixed();
    }

    function openRegionPanelFixed() {
      const rect = cityInput.getBoundingClientRect();
      cityPanel.style.position = "fixed";
      cityPanel.style.top = `${rect.bottom + 4}px`;
      cityPanel.style.left = `${rect.left}px`;
      cityPanel.style.width = `${rect.width}px`;
      cityPanel.hidden = false;
      cityInput.setAttribute("aria-expanded", "true");
    }

    function closeRegionPanel() {
      cityPanel.hidden = true;
      cityInput.setAttribute("aria-expanded", "false");
      cityPanel.style.position = cityPanel.style.top = cityPanel.style.left = cityPanel.style.width = "";
    }

    cityInput.addEventListener("input", () => renderRegionList(cityInput.value));
    cityInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeRegionPanel(); cityInput.blur(); }
    });
    document.addEventListener("click", (e) => {
      if (!cityCombobox.contains(e.target)) closeRegionPanel();
    });

    function toggleFrontageField() {
      const show = frontageTypes.includes(propertyTypeSelect.value);
      frontageField.hidden = !show;
      if (!show) form.elements.frontage_m.value = "";
    }
    propertyTypeSelect.addEventListener("change", () => {
      toggleFrontageField();
      mapPropertyTypeSelect.value = propertyTypeSelect.value;
      if (!hasPredicted) { mapCacheKey = ""; loadMapForSelection([], false); }
    });
    mapPropertyTypeSelect.addEventListener("change", () => {
      mapCacheKey = "";
      loadMapForSelection(pendingHighlightUrls, hasPredicted);
    });
    toggleFrontageField();

    function escapeHtml(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function ensurePropertyMap() {
      if (propertyMap) return propertyMap;
      propertyMap = L.map("property-map", { zoomControl: false, preferCanvas: true });
      L.control.zoom({ position: "bottomright" }).addTo(propertyMap);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OSM &copy; CARTO",
        subdomains: "abcd",
        maxZoom: 19,
      }).addTo(propertyMap);
      mapCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 48,
        spiderfyOnMaxZoom: true,
        chunkedLoading: true,
        chunkInterval: 40,
        chunkDelay: 6,
        disableClusteringAtZoom: 16,
      });
      propertyMap.addLayer(mapCluster);
      propertyMap.setView([21.0285, 105.8542], 11);
      mapInitialized = true;
      return propertyMap;
    }

    function buildMapPopup(point) {
      const link = point.url ? `<a href="${escapeHtml(point.url)}" target="_blank" rel="noopener">Xem tin</a>` : "";
      return `<div class="map-popup"><strong>${escapeHtml(point.title || "—")}</strong><p>${escapeHtml(point.price_short || "—")} · ${escapeHtml(String(point.area_m2 || "?"))} m²</p>${link}</div>`;
    }

    function createMapMarker(point) {
      const hi = !!point.highlight;
      return L.circleMarker([point.lat, point.lng], {
        radius: hi ? 9 : 5,
        color: hi ? "#b8860b" : "#1e4976",
        weight: hi ? 3 : 1.5,
        fillColor: hi ? "#d4a017" : "#2563eb",
        fillOpacity: hi ? 0.95 : 0.7,
      }).bindPopup(buildMapPopup(point));
    }

    function fitMapView(points, zoomHighlights) {
      if (!points.length) return;
      let target = points;
      if (zoomHighlights) {
        const hi = points.filter((p) => p.highlight);
        if (hi.length) target = hi;
      }
      if (target.length === 1) {
        propertyMap.setView([target[0].lat, target[0].lng], 15);
        return;
      }
      const lats = target.map((p) => p.lat);
      const lngs = target.map((p) => p.lng);
      propertyMap.fitBounds(
        [[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]],
        { padding: [60, 60], maxZoom: zoomHighlights ? 15 : 12 }
      );
    }

    function renderMapPoints(payload, zoomHighlights = false) {
      ensurePropertyMap();
      mapCluster.clearLayers();
      const points = Array.isArray(payload.points) ? payload.points : [];
      const total = points.length;
      let index = 0;
      const chunkSize = 700;

      function addChunk() {
        const end = Math.min(index + chunkSize, total);
        const batch = [];
        for (let i = index; i < end; i += 1) batch.push(createMapMarker(points[i]));
        mapCluster.addLayers(batch);
        index = end;
        if (index < total) {
          mapLoadingText.textContent = `${index.toLocaleString("vi-VN")} / ${total.toLocaleString("vi-VN")}`;
          requestAnimationFrame(addChunk);
          return;
        }
        mapLoading.hidden = true;
        mapShownCount.textContent = (payload.shown || total).toLocaleString("vi-VN");
        mapTotalCount.textContent = (payload.total_in_city || total).toLocaleString("vi-VN");
        fitMapView(points, zoomHighlights);
        setTimeout(() => propertyMap.invalidateSize(), 80);
      }

      if (!total) {
        mapLoading.hidden = true;
        mapShownCount.textContent = "0";
        mapTotalCount.textContent = "0";
        if (payload.center) propertyMap.setView([payload.center.lat, payload.center.lng], 10);
        return;
      }
      mapLoading.hidden = false;
      mapLoadingText.textContent = `0 / ${total.toLocaleString("vi-VN")}`;
      requestAnimationFrame(addChunk);
    }

    function mapCityCode() {
      return cityHidden.value || MAP_CITY;
    }

    async function loadMapForSelection(highlightUrls = [], zoomHighlights = false) {
      const city = mapCityCode();
      const propertyType = mapPropertyTypeSelect.value || propertyTypeSelect.value;
      const cacheKey = `${city}|${propertyType}|${highlightUrls.join("|")}|all`;
      if (cacheKey === mapCacheKey && mapInitialized && !zoomHighlights) return;

      const token = ++mapLoadToken;
      mapLoading.hidden = false;
      mapLoadingText.textContent = "";

      const params = new URLSearchParams({ city, all: "1" });
      if (propertyType) params.set("property_type", propertyType);
      if (highlightUrls.length) params.set("highlight_urls", highlightUrls.join(","));

      try {
        const response = await fetch(`/api/map/points?${params.toString()}`);
        const data = await response.json();
        if (token !== mapLoadToken) return;
        if (!data.success) {
          mapLoading.hidden = true;
          showToast(data.error || "Không tải được bản đồ.");
          return;
        }
        mapCacheKey = cacheKey;
        renderMapPoints(data.map, zoomHighlights);
      } catch {
        if (token === mapLoadToken) {
          mapLoading.hidden = true;
          showToast("Lỗi kết nối bản đồ.");
        }
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.hidden = false;
      setTimeout(() => { toast.hidden = true; }, 3500);
    }

    function buildNewsCard(ref) {
      const a = document.createElement("a");
      a.className = "news-card";
      a.href = ref.url || "#";
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const thumb = document.createElement("div");
      thumb.className = "news-thumb";
      const letter = document.createElement("span");
      letter.textContent = (ref.domain || "N").slice(0, 1).toUpperCase();
      thumb.appendChild(letter);
      if (ref.url) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = `/api/image-proxy?url=${encodeURIComponent(ref.url)}`;
        img.onload = () => letter.remove();
        img.onerror = () => img.remove();
        thumb.appendChild(img);
      }

      const body = document.createElement("div");
      body.className = "news-body";
      const price = document.createElement("p");
      price.className = "news-price";
      price.textContent = ref.price_short || "—";
      const title = document.createElement("p");
      title.className = "news-title";
      title.textContent = ref.title || "—";
      const meta = document.createElement("p");
      meta.className = "news-meta";
      meta.textContent = `${ref.area_m2 || "?"} m²`;
      body.appendChild(price);
      body.appendChild(title);
      body.appendChild(meta);
      a.appendChild(thumb);
      a.appendChild(body);
      return a;
    }

    function renderNews(refs, matched = false) {
      newsTrack.innerHTML = "";
      newsTrack.classList.remove("is-animating");
      refTitle.textContent = matched ? "Tin tương tự" : "Tin thị trường";

      if (!refs.length) return;

      const seen = new Set();
      const unique = refs.filter((ref) => {
        if (!ref.url || seen.has(ref.url)) return false;
        seen.add(ref.url);
        return true;
      });
      if (!unique.length) return;

      const row = document.createElement("div");
      row.className = "news-row";
      unique.forEach((ref) => row.appendChild(buildNewsCard(ref)));
      unique.forEach((ref) => row.appendChild(buildNewsCard(ref)));
      newsTrack.appendChild(row);
      newsTrack.classList.add("is-animating");
    }

    renderNews(Array.isArray(initialReferences) ? initialReferences.slice(0, 16) : []);
    ensurePropertyMap();
    loadMapForSelection([], false);

    window.addEventListener("resize", () => { if (propertyMap) propertyMap.invalidateSize(); });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (isSubmitting) return;
      if (!cityHidden.value) {
        showToast("Vui lòng chọn khu vực.");
        cityInput.focus();
        return;
      }

      isSubmitting = true;
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Đang tính…";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            property_type: form.elements.property_type.value,
            city: form.elements.city.value,
            area_m2: form.elements.area_m2.value,
            bedrooms: form.elements.bedrooms.value,
            bathrooms: form.elements.bathrooms.value,
            legal_status: form.elements.legal_status.value,
            furnished_status: form.elements.furnished_status.value,
            frontage_m: form.elements.frontage_m.value || 0,
          }),
        });
        const data = await response.json();
        if (!data.success) {
          showToast(data.error || "Không thể dự báo giá.");
          return;
        }

        const r = data.result;
        hasPredicted = true;
        resultPlaceholder.hidden = true;
        resultBody.hidden = false;
        document.getElementById("result-price").textContent = r.predicted_price_short;
        document.getElementById("result-full").textContent = r.predicted_price_full;
        document.getElementById("result-unit").textContent = r.unit_price_short + "/m²";
        document.getElementById("result-type").textContent = r.inputs.property_type;
        document.getElementById("result-area").textContent = r.inputs.area_m2 + " m²";
        document.getElementById("result-rooms").textContent =
          r.inputs.bedrooms + " PN · " + r.inputs.bathrooms + " WC";

        const refs = Array.isArray(r.references) ? r.references.slice(0, 10) : [];
        renderNews(refs, true);

        pendingHighlightUrls = refs.map((ref) => ref.url).filter((u) => u && u.startsWith("http"));
        mapPropertyTypeSelect.value = form.elements.property_type.value;
        mapCacheKey = "";
        loadMapForSelection(pendingHighlightUrls, true);
      } catch {
        showToast("Lỗi kết nối.");
      } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = "Dự báo giá";
      }
    });
  </script>
</body>
</html>
